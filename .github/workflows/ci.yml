name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole of Lucid: the menu-bar app, lucid-cli and the tests.
  build-and-test:
    name: Build and test on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Builds the app, lucid-cli and the test runner.
      - name: Build
        run: swift build

      # The unit tests. scripts/setup.sh and scripts/integration.sh are left out on
      # purpose: they download about 1 GB of models.
      - name: Unit tests
        run: scripts/test.sh

      # Draws the app's windows to PNG files without showing them.
      - name: Draw the windows
        timeout-minutes: 5
        run: .build/debug/Lucid --render-ui "$RUNNER_TEMP/ui"

      - name: Upload the drawings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui
          path: ${{ runner.temp }}/ui
          if-no-files-found: ignore

  # Everything but the menu-bar app, which is built on frameworks only a Mac has:
  # the dictation pipeline, the engines, lucid-cli and the tests.
  linux:
    name: Build and test on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: scripts/test.sh

  windows:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Windows runners do not come with Swift. The action is pinned to the commit of v0.5.1.
      # Swift 6.0 cannot be used: its headers clash with the current Windows SDK.
      - name: Install Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift run LucidCoreTests

  # The real thing on Windows: the engines and models that scripts\setup.ps1 installs, turning
  # synthesised speech into clean text. The unit tests above use stand-ins for both.
  windows-dictation:
    name: Dictate on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f
        with:
          swift-version: swift-6.2.3-release
          swift-build: 6.2.3-RELEASE

      # About 1 GB of engines and models. Kept between runs, so they are downloaded once.
      - name: Keep the engines and models
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Lucid
          key: lucid-windows-${{ hashFiles('scripts/setup.ps1') }}

      - name: Set up
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts\setup.ps1

      # Windows PowerShell, not PowerShell 7: it is the one that has the speech synthesiser.
      - name: Dictate synthesised speech
        shell: powershell
        run: |
          scripts\integration.ps1 | Tee-Object -FilePath dictation.txt
          $said = Get-Content dictation.txt -Raw
          if ($said -notmatch 'see you') { throw 'The speech engine did not hear "see you then".' }
          if ($said -notmatch 'cleanup model used') { throw 'The cleanup engine was never used.' }
          if ($said -match 'Paris') { throw 'Lucid answered a dictated question instead of cleaning it.' }
