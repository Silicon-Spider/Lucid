name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole of Lucid: the menu-bar app, lucid-cli and the tests.
  build-and-test:
    name: Build and test on macOS
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      # Builds the app, lucid-cli and the test runner.
      - name: Build
        run: swift build

      # The unit tests. scripts/setup.sh and scripts/integration.sh are left out on
      # purpose: they download about 1 GB of models.
      - name: Unit tests
        run: scripts/test.sh

      # Draws the app's windows to PNG files without showing them.
      - name: Draw the windows
        timeout-minutes: 5
        run: .build/debug/Lucid --render-ui "$RUNNER_TEMP/ui"

      - name: Upload the drawings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui
          path: ${{ runner.temp }}/ui
          if-no-files-found: ignore

  # Everything but the menu-bar app, which is built on frameworks only a Mac has:
  # the dictation pipeline, the engines, lucid-cli and the tests.
  linux:
    name: Build and test on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: scripts/test.sh

  windows:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Windows runners do not come with Swift. Pinned to the commit of v0.5.1.
      - name: Install Swift
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f
        with:
          swift-version: swift-6.0.3-release
          swift-build: 6.0.3-RELEASE

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift run LucidCoreTests
